name: Python Syntax & Benchmark CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python AST Compilation & Execute Benchmark Suite
        run: |
          python -m py_compile llm_security_benchmark_suite.py src/*.py
          python llm_security_benchmark_suite.pybr
