name: LLM Security Prototype Tests

on:
  push:
    branches: ["main", "maintenance/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and behavior tests
        run: |
          python -m py_compile llm_security_benchmark_suite.py src/*.py
          python -m unittest discover -s tests -v
      - name: Smoke benchmark
        run: python llm_security_benchmark_suite.py
      - name: Validate C++ and shell streaming examples
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror src/compressed_generator.cpp -lz -o /tmp/compressed_generator
          /tmp/compressed_generator 10 /tmp/omega-stream-test.csv.gz
          test "$(gzip -dc /tmp/omega-stream-test.csv.gz | wc -l)" -eq 11
          if /tmp/compressed_generator -1 /tmp/omega-invalid.csv.gz; then exit 1; fi
          if /tmp/compressed_generator not-a-number /tmp/omega-invalid.csv.gz; then exit 1; fi
          bash -n src/posix_awk_split_streamer.sh
          temp_dir="$(mktemp -d)"
          bash src/posix_awk_split_streamer.sh "$temp_dir" 10
          test "$(cat "$temp_dir"/part_*.csv | wc -l)" -eq 10
